version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hr_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_SQLITE=true
      - SQLITE_PATH=/app/data/hr_local.db
      - CV_UPLOAD_DIR=/app/uploaded_cvs
    volumes:
      - cv_uploads:/app/uploaded_cvs
      - app_data:/app/data
    depends_on:
      - mongo
      - redis
    networks:
      - hr_network
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hr_celery
    command: celery -A backend.tasks.celery_worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_SQLITE=true
      - SQLITE_PATH=/app/data/hr_local.db
      - CV_UPLOAD_DIR=/app/uploaded_cvs
    volumes:
      - cv_uploads:/app/uploaded_cvs
      - app_data:/app/data
    depends_on:
      - redis
      - mongo
    networks:
      - hr_network
    restart: unless-stopped

  # ── Celery Flower (monitoring) ───────────────────────────────────────────────
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hr_flower
    command: celery -A backend.tasks.celery_worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - hr_network
    restart: unless-stopped

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: hr_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hr_network
    restart: unless-stopped

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: hr_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: hr_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── MySQL (optional) ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hr_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hr_structured
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  mysql_data:
  cv_uploads:
  app_data:

networks:
  hr_network:
    driver: bridge

<svg width="850" height="750" viewBox="0 0 850 750" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f4f7f6" />
  
  <style>
    .box { fill: white; stroke: black; stroke-width: 1.5; rx: 8px; }
    .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; fill: #1f2937; }
    .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; text-anchor: middle; fill: #4b5563; }
    .line { stroke: #374151; stroke-width: 1.5; fill: none; }
    .icon { fill: none; stroke: #1f2937; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Définition de la flèche -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <!-- Section Utilisateur -->
  <g transform="translate(150, 70)">
    <!-- Icône Utilisateur -->
    <circle cx="0" cy="-15" r="14" class="icon" />
    <path d="M-22,15 C-22,5 -10,0 0,0 C10,0 22,5 22,15" class="icon" />
    <text x="0" y="40" class="text-title" font-size="16">User</text>
  </g>

  <!-- Frontend -->
  <!-- J'ai élargi et grandi la boîte considérablement -->
  <rect x="250" y="20" width="300" height="100" class="box" />
  <text x="400" y="60" class="text-title">Frontend</text>
  <text x="400" y="90" class="text-sub">(ReactJS / Vite)</text>

  <!-- Flèche Frontend -> Backend -->
  <line x1="400" y1="120" x2="400" y2="155" class="line" marker-end="url(#arrowhead)" />

  <!-- Backend -->
  <rect x="250" y="160" width="300" height="100" class="box" />
  <text x="400" y="195" class="text-title">Backend</text>
  <text x="400" y="220" class="text-sub">(FastAPI)</text>
  <text x="400" y="245" class="text-sub" font-size="13">Orchestration : LangGraph</text>

  <!-- Lignes de distribution centrales -->
  <line x1="400" y1="260" x2="400" y2="290" class="line" />
  <line x1="130" y1="290" x2="670" y2="290" class="line" />

  <!-- BDDs : SQLite & MongoDB -->
  <line x1="130" y1="290" x2="130" y2="335" class="line" marker-end="url(#arrowhead)" />
  <rect x="10" y="340" width="240" height="100" class="box" />
  <text x="130" y="380" class="text-title">SQLite</text>
  <text x="130" y="405" class="text-title">&amp; MongoDB</text>

  <!-- FAISS -->
  <line x1="400" y1="290" x2="400" y2="335" class="line" marker-end="url(#arrowhead)" />
  <rect x="280" y="340" width="240" height="100" class="box" />
  <text x="400" y="375" class="text-sub">Base vectorielle (RAG)</text>
  <text x="400" y="410" class="text-title" font-size="24">FAISS</text>

  <!-- LLM -->
  <line x1="670" y1="290" x2="670" y2="335" class="line" marker-end="url(#arrowhead)" />
  <rect x="550" y="340" width="240" height="100" class="box" />
  <text x="670" y="380" class="text-title">LLM</text>
  <text x="670" y="405" class="text-sub">via Groq &amp; Ollama</text>

  <!-- Flèche FAISS -> Sécurité -->
  <line x1="400" y1="440" x2="400" y2="485" class="line" marker-end="url(#arrowhead)" />

  <!-- Sécurité -->
  <rect x="150" y="490" width="500" height="150" class="box" />
  <text x="400" y="530" class="text-title" font-size="20">Sécurité</text>
  
  <text x="400" y="565" class="text-sub" font-size="16">— API sécurisée avec JWT</text>
  <text x="400" y="595" class="text-sub" font-size="16">🔐 Architecture Hybride</text>
  <text x="400" y="620" class="text-sub" font-size="14">(Données RH protégées via local)</text>

</svg>
